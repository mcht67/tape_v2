general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/Polyphonic-BirdSet-train
  subset: HSN
  train_config: HSN_polyphonic_8
  soundscape_config: HSN_soundscape_test
  max_polyphony: 8
# embeddings:
#   # Unused by torch_train.py (it fine-tunes the pretrained encoder end-to-end
#   # from raw audio instead of precomputed embeddings), left here only because
#   # other scripts (train.py, the eval scripts' TF path) still read it.
#   name: perch_v2_cpu
#   type: perch_v2
#   dimension_type: pooled
model:
  _target_: utils.torch_models.BirdSetBirdMAE
  pretrained_model_path: DBD-research-group/Bird-MAE-Huge
  # _target_: utils.torch_models.BirdSetEfficientNet
  # pretrained_model_path: DBD-research-group/EfficientNet-B1-BirdSet-XCL
  # Read by evaluate_on_test_split.py / evaluate_on_soundscape_data.py to pick
  # the torch path; torch_train.py itself doesn't need this key.
head:
  _target_: utils.torch_models.SimpleMLPHead
  input_size: null  # filled in by torch_train.py
  objectives_cfg: null   # filled in by torch_train.py

objectives:

  polyphony_reg:
    # NOTE: torch_train.py builds losses itself based on the objective name
    # (see torch_losses.create_losses_from_objectives_torch) -- this `loss:`
    # block is TF-only and is ignored on the torch path. Leaving it here is
    # harmless and keeps this file usable by train.py too.
    # loss:
    #   _target_: tensorflow.keras.losses.MeanSquaredError
    weight: 1.0
    confusion_matrix:
      type: regression_round
      threshold: 0.5
    label: polyphony_reg

  # Uncomment to test more of MultiTaskHead once polyphony_reg alone works --
  # all of these are supported by MultiTaskHead now (it mirrors model.py's
  # TemporalCNN and operates on spatial_embeddings):

