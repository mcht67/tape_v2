train:
  # Raw audio column -- torch_train.py always reads this (not
  # input_feature_name, which is the TF pipeline's precomputed-embedding
  # column and is unused here).
  input_feature: audio
  # input_feature_name: perch_v2_cpu_audio_pooled_embeddings
  precomputed_embeddings: False
  batch_size: 8          # kept small for a fast first smoke test; raise once this runs cleanly
  learning_rate: 0.001
  epochs: 5
  initial_epoch: null
  num_batches_train: 1   # one batch is enough to prove the pipeline runs end to end
  num_batches_val: 1
  eval_batch_size: 1 
  backend: torch
  head_type: mlp 
  freeze_encoder: true  # freeze the encoder for the first `freeze_epochs` epochs, then unfreeze for fine-tuning
  freeze_epochs: 2           # train the head alone for N epochs, then unfreeze
  finetune_learning_rate: 1e-5   # optional; lower LR for the encoder
       # used by the evaluate_* scripts' torch path, not by torch_train.py
log:
  study_name: test-study
  hyperparameters: null
  objectives_to_log:
    - polyphony_reg
evaluation:
  example_indices:
  - 0
  - 1
  - 2
  num_examples: 3
datetime: '20260511_140603'
path:
  train_output: train_output/
  eval_output: eval_output/
  soundscape_eval_output: soundscape_eval_output/   # required by get_log_paths(), missing in the old file
  study_subfolder: study_subfolder/
  train_log_dir: train_output/test-study/local-test-experiment/logs/
  eval_log_dir: eval_output/test-study/local-test-experiment/logs/
  checkpoint_dir: train_output/test-study/local-test-experiment/checkpoints/
python:
  base: venv/bin/python
  perch: perch-venv/bin/python
  train: train-venv/bin/python
  complete: complete-venv/bin/python
