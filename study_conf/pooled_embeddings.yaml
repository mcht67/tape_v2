dataset_subsets: # iterated over in multi_submission.py, therefore not added to hyperparams
  - "UHH"
  # - "HSN"
  # - "PER"
  # - "NES"
  # - "POW"
  # - "SSW"
  # - "SNE"
  # - "XCM"

base_config:
  log.study_name: "Pooled-Embeddings"
  embeddings.dimension_type: pooled
  dataset.huggingface_path: "mcht67/PolyBirdMix"
  dataset.max_polyphony: 8
  dataset.min_snr: -10
  train.epochs: 100
  train.batch_size: 32
  train.learning_rate: 0.001
  train.early_stopping_patience: 10
  train.early_stopping_delay_epochs: 10
  path.study_subfolder: ${embeddings.name}/
  log.objectives_to_log:  # add all objectives used within the study to log their metrics in the hParam tab of tensorboard
    - polyphony_reg
    - polyphony_class
  # log.metrics:
  #   - val_loss
  #   - val_accuracy # use val_accuracy if only one objective is used

hyperparams:
  model:
    - "SimpleMLP"
  train.input_feature:
    - "audio"
    # - "no_noise_audio"
  embeddings:
    # - "EfficientNet-B1-BirdSet-XCL"
    # - "AudioProtoPNet-20-BirdSet-XCL"
    - "birdnet_V2.3"
    # # - "birdnet_V2.4"
    # - "vggish"
    # - "perch_8"
    # - "yamnet"
    # - "beans_baseline"
    # - "Bird-MAE-Huge"
    # - "AST-Birdset-XCL"
    # - "Wav2Vec2-Base-BirdSet-XCL"
    # - "perch_v2_cpu"
    # - "perch_v2"
  objectives:
    - "polyphony_reg"
    # - "polyphony_class"
  # dataset.config is added automatically per dataset_config iteration