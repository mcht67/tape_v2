base_config:
  log.study_name: "Pooled-Embeddings-Comparison"
  embeddings.dimension_type: pooled
  dataset.huggingface_path: "mcht67/Polyphonic-BirdSet-train"
  dataset.train_suffix: polyphonic_6
  train.epochs: 20
  train.learning_rate: 0.001
  path.output_subfolder: ${embeddings.name}/
  

hyperparams:
  model:
    - "SimpleMLP"
  train.input_feature:
    - "audio"
    # - "no_noise_audio"
  embeddings:
    # - "birdnet_V2.3"
    # - "vggish"
    - "perch_8"
    # - "yamnet"
    # - "beans_baseline"
    # - "EfficientNet-B1-BirdSet-XCL"
