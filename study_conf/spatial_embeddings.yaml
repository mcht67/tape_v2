  # - "POW"
  # - "SSW"
  # - "SNE"
  - "XCM"

base_config:
  log.study_name: "Spatial-Embeddings"
  embeddings.dimension_type: spatial
  dataset.huggingface_path: "mcht67/PolyBirdMix"
  dataset.max_polyphony: 8
  train.epochs: 100
  train.learning_rate: 0.001
  train.early_stopping_patience: 20
  train.early_stopping_delay_epochs: 35
  path.study_subfolder: ${embeddings.name}/
  log.objectives_to_log:  # add all objectives used within the study to log their metrics in the hParam tab of tensorboard
    - polyphony_reg
    - polyphony_class
    - event_logits
    - framewise_polyphony_reg
    - framewise_polyphony_class

hyperparams:
  model:
    - "TemporalCNN"
  train.input_feature:
    - "audio"
    # - "no_noise_audio"
  embeddings:
    # - "vggish"
    # - "yamnet"
    # - "beans_baseline"
    - "EfficientNet-B1-BirdSet-XCL"
    # - "AudioProtoPNet-20-BirdSet-XCL"
    # - "AST-Birdset-XCL"
    # - "Wav2Vec2-Base-BirdSet-XCL"
    # - "perch_v2_cpu"
    # - "perch_v2"
    # - "NatureLMBEATs"
  objectives:
    - "polyphony_reg"
