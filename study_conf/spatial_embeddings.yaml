base_config:
  log.study_name: "Spatial-Embeddings"
  embeddings.dimension_type: spatial
  dataset.huggingface_path: "mcht67/Polyphonic-BirdSet-train"
  dataset.max_polyphony: 8
  train.epochs: 100
  train.learning_rate: 0.001
  train.early_stopping_patience: 5
  train.early_stopping_delay_epochs: 25
  path.study_subfolder: ${embeddings.name}/

hyperparams:
  model:
    - "TemporalCNN"
  train.input_feature:
    # - "audio"
    - "no_noise_audio"
  embeddings:
    - "vggish"
    # - "yamnet"
    # - "beans_baseline"
    # - "EfficientNet-B1-BirdSet-XCL"
    # - "AudioProtoPNet-20-BirdSet-XCL"
    # - "AST-Birdset-XCL"
    # - "Wav2Vec2-Base-BirdSet-XCL"
    # - "perch_v2_cpu"
    # - "perch_v2"
  objectives:
    # - "polyphony_reg"
    # - "polyphony_class"
    # - "multi_task_v0_polyphony_reg_class"
    # - "multi_task_v1_add_event_logits_reg"
    # - "multi_task_v2_add_framewise_polyphony_reg"
