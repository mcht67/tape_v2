    - path: stage_results/dataset_metadata.json
      hash: md5
      md5: d3875799b75f848cc2b987b3efead8e1
      size: 2388
    params:
      params.yaml:
        embeddings:
          type: perch_v1
    outs:
    - path: stage_results/birdset_embeddings_metadata.json
      hash: md5
      md5: 3f4209a31e1097e40b66ba4f24955df7
      size: 105
