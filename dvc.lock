schema: '2.0'
stages:
  load_dataset:
    cmd: venv/bin/python source/load_dataset.py
    deps:
    - path: source/load_dataset.py
      hash: md5
      md5: 83142bec94f4f9ba01b9cbb85daebbe1
      size: 1600
    params:
      params.yaml:
        dataset.huggingface_path: mcht67/Polyphonic-Bird-Set
        dataset.subset: PER
        path.dataset_metadata: stage_results/dataset_metadata.json
    outs:
    - path: stage_results/dataset_metadata.json
      hash: md5
      md5: d3875799b75f848cc2b987b3efead8e1
      size: 2388
  embed_with_perch:
    cmd: envs/perch-venv/bin/python source/embed_audio.py
    deps:
    - path: source/embed_audio.py
      hash: md5
      md5: 732b5bcc990bf113264691e22bfa1baf
      size: 13600
    - path: stage_results/dataset_metadata.json
      hash: md5
      md5: fd3ee9ef2ecf32225ac369ec3423d77c
      size: 144
    params:
      params.yaml:
        embeddings:
          input_features:
          - audio
          - no_noise_audio
          models:
          - perch_v2_cpu
          - birdnet_V2.3
    outs:
    - path: stage_results/embeddings_metadata.json
      hash: md5
      md5: 4b714c36f38eae7f9be69cb74743c337
      size: 142
  add_labels:
    cmd: venv/bin/python source/add_labels.py
    deps:
    - path: source/add_labels.py
      hash: md5
      md5: cfb58edd765635cccda10034d9b1bd98
      size: 7150
    - path: stage_results/dataset_metadata.json
      hash: md5
      md5: d3875799b75f848cc2b987b3efead8e1
      size: 2388
    params:
      params.yaml:
        labels:
          event_logits:
            num_logits: 16
          framewise_polyphony:
            num_frames: 16
        path.dataset: data/PER/
    outs:
    - path: data/PER/
      hash: md5
      md5: 15b50de77c595e48c4c6cb9fdeca2528.dir
      size: 3804252
      nfiles: 10
    - path: stage_results/added_labels_metadata.json
      hash: md5
      md5: edea1e974dfc50eb749c562725624182
      size: 148
  train:
    cmd: train-venv/bin/python source/train.py
    deps:
    - path: source/train.py
      hash: md5
      md5: b417d7aec02ecd23380878cb45a047eb
      size: 26006
    params:
      params.yaml:
        dataset:
          huggingface_path: mcht67/polyphonic-bird-set-with-embeddings
          config: HSN_polyphonic
        general.random_seed: 42
        log:
          experiment_name: Embeddings-Comparison
          tensorboard_subfolder: Embeddings-Comparison
          tensorboard_suffix: ''
          hyperparameters:
          - model
          - dataset.config
          - train.input_feature
          - embeddings
          - objectives
        model:
          _target_: model.TemporalCNN
        objectives:
          polyphony_degree:
            loss:
              _target_: tensorflow.keras.losses.MeanSquaredError
            weight: 1.0
            confusion_matrix:
              type: regression_round
              threshold: 0.5
            label: polyphony_degree
          event_logits:
            loss:
              _target_: tensorflow.keras.losses.BinaryCrossentropy
              from_logits: false
              label_smoothing: 0.1
            scheduler:
              switch_epochs:
              - 0
              - 10
              - 20
              - 30
              - 40
              weights:
              - 10.0
              - 5.0
              - 1.0
              - 0.5
              - 0.1
            confusion_matrix:
              type: binary
            label: event_logits
        train:
          input_feature: no_noise_audio
          input_feature_name: perch_v2_cpu_no_noise_audio_spatial_embeddings
          batch_size: 128
          learning_rate: 0.001
          epochs: 5
          initial_epoch:
          num_batches_train:
          num_batches_val:
    outs:
    - path: checkpoints
      hash: md5
      md5: f085be5320e013655d013fee019e9fab.dir
      size: 346152315
      nfiles: 12
    - path: logs
      hash: md5
      md5: 42c964f3adcf7f05c951c287fa176e10.dir
      size: 6880997
      nfiles: 32
  embed_audio_with_perch:
    cmd: stage-venvs/perch-venv/bin/python source/embed_audio.py
    deps:
    - path: source/embed_audio.py
      hash: md5
      md5: f41dcb1d4912ed54592f62e6d3bee895
      size: 19129
    - path: stage_results/dataset_metadata.json
      hash: md5
      md5: d3875799b75f848cc2b987b3efead8e1
      size: 2388
    params:
      params.yaml:
        embeddings:
          type: perch_v1
    outs:
    - path: stage_results/perch_embeddings_metadata.json
      hash: md5
      md5: 6f1900420d7aee9b2aea9327c5f0954d
      size: 104
  embed_audio_with_birdset:
