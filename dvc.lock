  train:
    cmd: /opt/complete-venv/bin/python source/train.py
    deps:
    - path: source/train.py
      hash: md5
      md5: aa6a1165b4fb69003b548565f5aa3c09
      size: 25284
    params:
      params.yaml:
        dataset:
          huggingface_path: mcht67/Polyphonic-BirdSet-train
          subset: PER/PER_polyphonic_8
          max_polyphony: 8
          train_config: PER_polyphonic_8
          soundscape_config: PER/PER_polyphonic_8_soundscape_test
        general.random_seed: 42
        log:
          study_name: Spatial-Embeddings
          keep_last_n_checkpoints: 5
          hyperparameters:
          - model
          - train.input_feature
          - embeddings
          - objectives
          - dataset.subset
          - dataset.train_config
          metrics:
        model:
          _target_: model.TemporalCNN
        objectives:
          polyphony_reg:
            loss:
              _target_: tensorflow.keras.losses.MeanSquaredError
            weight: 1.0
            confusion_matrix:
              type: regression_round
              threshold: 0.5
            label: polyphony_reg
          event_logits:
            loss:
              _target_: tensorflow.keras.losses.BinaryCrossentropy
              from_logits: false
              label_smoothing: 0.1
            scheduler:
              switch_epochs:
              - 0
              - 5
              - 10
              - 15
              - 20
              weights:
              - 10.0
              - 5.0
              - 1.0
              - 0.5
              - 0.1
            confusion_matrix:
              type: binary
            label: event_logits
          framewise_polyphony_reg:
            loss:
              _target_: tensorflow.keras.losses.MeanSquaredError
            scheduler:
              switch_epochs:
              - 0
              - 5
              - 10
              - 15
              - 20
              weights:
              - 5.0
              - 10.0
              - 5.0
              - 1.0
              - 0.5
            confusion_matrix:
              type: regression_round
              threshold: 0.5
            label: framewise_polyphony_reg
        train:
          input_feature: no_noise_audio
          input_feature_name: 
            EfficientNet-B1-BirdSet-XCL_no_noise_audio_spatial_embeddings
          batch_size: 32
          learning_rate: 0.001
          early_stopping_patience: 5
          early_stopping_delay_epochs: 25
          epochs: 100
          initial_epoch:
          num_batches_train:
          num_batches_val:
    outs:
    - path: train_output/Spatial-Embeddings/EfficientNet-B1-BirdSet-XCL/
      hash: md5
      md5: 55253ee88fa1eeeb8a3ec251eab39c73.dir
      size: 15715369
      nfiles: 7
  embed_audio_with_perch:
