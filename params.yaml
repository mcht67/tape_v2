general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/PolyphonicBirdSet
  subset: HSN
  split: train
embeddings:
  input_features:
  - audio
  - no_noise_audio
  models:
  - perch_v2_cpu
  - birdnet_V2.3
model:
  _target_: model.TemporalCNNMultiTask_v2
objectives:
  polyphony_degree:
    loss:
      _target_: tensorflow.keras.losses.MeanSquaredError
    weight: 1.0
    confusion_matrix:
      type: regression_round
      threshold: 0.5
train:
  input_feature_name: perch_v2_cpu_audio_spatial_embeddings
  batch_size: 128
  learning_rate: 0.0001
  epochs: 50
  train_size_batches: 76
  use_event_logits: true
  num_event_logits: 16
  event_logits_name: event_logits
  use_framewise_polyphony: true
  num_frames: 16
  framewise_polyphony_name: framewise_polyphony
log:
  experiment_name: MultiTask_SpatialEmbeddings
  tensorboard_subfolder: MultiTask_SpatialEmbeddings
  tensorboard_suffix: ''
  hyperparameters:
  - objectives
path:
  dataset: dataset
  dataset_metadata: stage_results/dataset_metadata.json
  embeddings_metadata: stage_results/embeddings_metadata.json
  added_labels_metadata: stage_results/added_labels_metadata.json
