# Do not change paths, this could break dvc tracking
paths:
  dataset: dataset
  dataset_metadata: dataset/metadata.json

general:
  random_seed: 42

dataset:
  huggingface_path: mcht67/PolyphonicBirdSet
  subset: HSN
  split: train

embeddings:
  compute_embedding: 'True'
  perch_v1_models:
  - birdnet_V2.3
  - perch_8
  perch_v2_models:
  - perch_v2_cpu
  birdset_models:
  - bird_mae
  feature: no_noise_audio

model:
  _target_: model.TemporalCNNMultiTask
  # hidden_units:
  # - 512
  # - 256
  # dropout_rate: 0.3

train:
  features: perch_v2_cpu_spatial_embeddings
  labels: 
    - polyphony_degree
    - perch2_event_logits
  test_split: 0.1
  val_split: 0.1
  batch_size: 128
  learning_rate: 0.001
  epochs: 50
  tensorboard_path: debug_tensorboard



