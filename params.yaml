general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/Polyphonic-BirdSet-train
  config: HSN_polyphonic_6
embeddings:
  name: Birdnet_V2.3
  type: perch_v1
model:
  _target_: model.SimpleMLP
  hidden_units:
  - 512
  - 256
  dropout_rate: 0.3
objectives:
  polyphony_degree:
    loss:
      _target_: tensorflow.keras.losses.MeanSquaredError
    confusion_matrix:
      type: regression_round
      threshold: 0.5
    label: polyphony_degree
train:
  input_feature: null
  input_feature_name: birdnet_V2.3_audio_embeddings
  batch_size: 128
  learning_rate: 0.001
  epochs: 1
  initial_epoch: null
  num_batches_train: 1
  num_batches_val: 1
log:
  study_name: test-study
  hyperparameters: null
datetime: '20260506_112448'
path:
  train_output: train_output/
  eval_output: eval_output/
  val_dataset: data/val_data/
  train_log_dir: train_output/test-study/Birdnet_V2.3/20260506_112448_test-experiment/logs/
  eval_log_dir: eval_output/test-study/Birdnet_V2.3/20260506_112448_test-experiment/logs/
  checkpoint_dir: train_output/test-study/Birdnet_V2.3/20260506_112448_test-experiment/checkpoints/
python:
  base: venv/bin/python
  perch: perch-venv/bin/python
  train: train-venv/bin/python
  complete: complete-venv/bin/python
