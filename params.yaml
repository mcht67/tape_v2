general:
  random_seed: 52
dataset:
  huggingface_path: mcht67/PolyphonicBirdSet
  subset: HSN
  split: train
embeddings:
  input_feature: audio
  model: perch_v2_cpu
  name: perch_v2_cpu_audio
model:
  _target_: model.TemporalCNNMultiTask_v2
train:
  input_feature_name: perch_v2_cpu_audio_spatial_embeddings
  labels:
  - polyphony_degree
  - framewise_polyphony
  - perch2_event_logits
  batch_size: 128
  learning_rate: 0.01
  epochs: 5
  tensorboard_path: debug_tensorboard
  use_event_logits: true
  num_event_logits: 16
  event_logits_name: perch2_event_logits
  use_framewise_polyphony: true
  num_frames: 16
  framewise_polyphony_name: framewise_polyphony
path:
  dataset: dataset
  dataset_metadata: stage_results/dataset_metadata.json
