general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/Polyphonic-BirdSet-train
  subset: HSN/HSN_polyphonic_8
  max_polyphony: 8
  train_config: HSN_polyphonic_8
  soundscape_config: HSN/HSN_polyphonic_8_soundscape_test
embeddings:
  name: BeansBaseline
  type: perch_v1
  dimension_type: spatial
model:
  _target_: model.TemporalCNN
objectives:
  polyphony_class:
    loss:
      _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
      from_logits: true
    weight: 1.0
    confusion_matrix:
      type: classification
    label: polyphony_reg
    num_classes: null
train:
  input_feature: no_noise_audio
  input_feature_name: beans_baseline_no_noise_audio_spatial_embeddings
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 5
  early_stopping_delay_epochs: 25
  epochs: 100
  initial_epoch: null
  num_batches_train: null
  num_batches_val: null
log:
  study_name: Spatial-Embeddings
  keep_last_n_checkpoints: 5
  hyperparameters:
  - model
  - train.input_feature
  - embeddings
  - objectives
  - dataset.subset
  - dataset.train_config
  metrics: null
datetime: '20260613_124756'
path:
  study_subfolder: BeansBaseline/
  train_output: train_output/Spatial-Embeddings/BeansBaseline/
  eval_output: eval_output/Spatial-Embeddings/BeansBaseline/
python:
  base: venv/bin/python
  perch: perch-venv/bin/python
  train: train-venv/bin/python
  complete: /opt/complete-venv/bin/python
