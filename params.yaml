general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/Polyphonic-BirdSet-train
  subset: PER/PER_polyphonic_8
  max_polyphony: 8
  train_config: PER_polyphonic_8
  soundscape_config: PER/PER_polyphonic_8_soundscape_test
embeddings:
  name: perch_v2_cpu
  type: perch_v2
  dimension_type: pooled
model:
  _target_: model.SimpleMLP
  hidden_units:
  - 512
  - 256
  dropout_rate: 0.3
objectives:
  polyphony_degree:
    loss:
      _target_: tensorflow.keras.losses.MeanSquaredError
    weight: 1.0
    confusion_matrix:
      type: regression_round
      threshold: 0.5
    label: polyphony_degree
train:
  input_feature: no_noise_audio
  input_feature_name: perch_v2_cpu_no_noise_audio_pooled_embeddings
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 10
  epochs: 100
  initial_epoch: null
  num_batches_train: null
  num_batches_val: null
log:
  study_name: Pooled-Embeddings
  exp_name: test-exp
  keep_last_n_checkpoints: 5
  hyperparameters:
  - model
  - train.input_feature
  - embeddings
  - objectives
  - dataset.subset
  - dataset.train_config
  metrics:
  - val_loss
  - val_accuracy
datetime: '20260609_151151'
path:
  study_subfolder: perch_v2_cpu/
  train_output: train_output/Pooled-Embeddings/perch_v2_cpu/
  eval_output: eval_output/Pooled-Embeddings/perch_v2_cpu/
python:
  base: venv/bin/python
  perch: perch-venv/bin/python
  train: train-venv/bin/python
  complete: /opt/complete-venv/bin/python
