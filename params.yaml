general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/Polyphonic-BirdSet-train
  subset: HSN
  train_config: HSN_polyphonic_6
  soundscape_config: HSN_soundscape_test
  max_polyphony: 8
embeddings:
  name: Birdnet_V2.3
  type: perch_v1
  dimension_type: pooled
model:
  _target_: model.SimpleMLP
  hidden_units:
  - 512
  - 256
  dropout_rate: 0.3
objectives:
  polyphony_degree_class:
    loss:
      _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
      from_logits: true
    weight: 1.0
    confusion_matrix:
      type: classification
    label: polyphony_degree
    num_classes: 7
train:
  input_feature: null
  input_feature_name: EfficientNet-B1-BirdSet-XCL_audio_pooled_embeddings
  batch_size: 128
  learning_rate: 0.001
  epochs: 1
  initial_epoch: null
  num_batches_train: 1
  num_batches_val: 1
log:
  study_name: test-study
  hyperparameters: null
evaluation:
  example_indices:
  - 0
  - 1
  - 2
  num_examples: 3
datetime: '20260511_140603'
path:
  train_output: train_output/
  eval_output: eval_output/
  study_subfolder: null
  train_log_dir: train_output/test-study/local-test-experiment/logs/
  eval_log_dir: eval_output/test-study/local-test-experiment/logs/
  checkpoint_dir: train_output/test-study/local-test-experiment/checkpoints/
python:
  base: venv/bin/python
  perch: perch-venv/bin/python
  train: train-venv/bin/python
  complete: complete-venv/bin/python
