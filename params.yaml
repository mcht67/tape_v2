general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/PolyBirdMix
  subset: SNE
  max_polyphony: 8
  min_snr: -10
  train_config: SNE_polyphonic
  soundscape_config: SNE_soundscape_test
embeddings:
  name: Bird-MAE-Huge
  type: birdset
  dimension_type: pooled
  model_cfg:
    _target_: torch_models.BirdSetBirdMAE
    pretrained_model_path: DBD-research-group/Bird-MAE-Huge
model:
  _target_: model.SimpleMLP
  hidden_units:
  - 512
  - 256
  dropout_rate: 0.3
objectives:
  polyphony_class:
    loss:
      _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
      from_logits: true
    weight: 1.0
    confusion_matrix:
      type: classification
    label: polyphony_reg
    num_classes: null
train:
  input_feature: audio
  input_feature_name: Bird-MAE-Huge_audio_pooled_embeddings
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 10
  early_stopping_delay_epochs: 0
  epochs: 100
  initial_epoch: null
  num_batches_train: null
  num_batches_val: null
log:
  study_name: Pooled-Embeddings
  keep_last_n_checkpoints: 5
  hyperparameters:
  - model
  - train.input_feature
  - embeddings
  - objectives
  - dataset.subset
  - dataset.train_config
  objectives_to_log:
  - polyphony_reg
  - polyphony_class
datetime: '20260705_032858'
path:
  study_subfolder: Bird-MAE-Huge/
  train_output: train_output/Pooled-Embeddings/Bird-MAE-Huge/
  eval_output: eval_output/Pooled-Embeddings/Bird-MAE-Huge/
python:
  base: venv/bin/python
  perch: perch-venv/bin/python
  train: train-venv/bin/python
  complete: /opt/complete-venv/bin/python
