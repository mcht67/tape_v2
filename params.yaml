general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/polyphonic-bird-set-with-embeddings
  config: HSN
embeddings:
  input_features:
  - audio
  perch_models:
  - perch_v2_cpu
  birdset_models:
    birdset_efficient_net:
      _target_: torch_models.BirdSetEfficientNet
      pretrained_model_path: DBD-research-group/EfficientNet-B1-BirdSet-XCL
  force_recompute: true
model:
  _target_: model.SimpleMLP
  hidden_units:
  - 512
  - 256
  dropout_rate: 0.3
objectives:
  polyphony_degree:
    loss:
      _target_: tensorflow.keras.losses.MeanSquaredError
    confusion_matrix:
      type: regression_round
      threshold: 0.5
    label: polyphony_degree
train:
  input_feature: null
  input_feature_name: perch_v2_cpu_audio_embeddings
  batch_size: 128
  learning_rate: 0.001
  epochs: 5
  initial_epoch: null
  num_batches_train: null
  num_batches_val: null
log:
  experiment_name: test-experiment
  tensorboard_subfolder: ${log.experiment_name}
  tensorboard_suffix: ''
  hyperparameters: null
path:
  dataset: data/${dataset.config}/
  dataset_metadata: stage_results/dataset_metadata.json
  perch_embeddings_metadata: stage_results/perch_embeddings_metadata.json
  birdset_embeddings_metadata: stage_results/birdset_embeddings_metadata.json
  added_labels_metadata: stage_results/added_labels_metadata.json
python:
  base: venv/bin/python
  perch: perch-venv/bin/python
  train: train-venv/bin/python
  complete: complete-venv/bin/python
