general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/Polyphonic-BirdSet-train
  subset: HSN/HSN_polyphonic_8
  max_polyphony: 8
  train_config: HSN_polyphonic_8
  soundscape_config: HSN/HSN_polyphonic_8_soundscape_test
embeddings:
  name: Wav2Vec2-Base-BirdSet-XCL
  type: birdset
  dimension_type: spatial
  model_cfg:
    _target_: torch_models.BirdSetWav2Vec2
    pooling: mean
    pretrained_model_path: DBD-research-group/Wav2Vec2-Base-BirdSet-XCL
model:
  _target_: model.TemporalCNN
objectives:
  polyphony_class:
    loss:
      _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
      from_logits: true
    weight: 1.0
    confusion_matrix:
      type: classification
    label: polyphony_class
    num_classes: null
  event_logits:
    loss:
      _target_: tensorflow.keras.losses.BinaryCrossentropy
      from_logits: false
      label_smoothing: 0.1
    scheduler:
      switch_epochs:
      - 0
      - 5
      - 10
      - 15
      - 20
      weights:
      - 10.0
      - 5.0
      - 1.0
      - 0.5
      - 0.1
    confusion_matrix:
      type: binary
    label: event_logits
  framewise_polyphony_class:
    loss:
      _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
      from_logits: true
    scheduler:
      switch_epochs:
      - 0
      - 5
      - 10
      - 15
      - 20
      weights:
      - 5.0
      - 10.0
      - 5.0
      - 1.0
      - 0.5
    confusion_matrix:
      type: classification
    label: framewise_polyphony_class
    num_classes: null
train:
  input_feature: audio
  input_feature_name: Wav2Vec2-Base-BirdSet-XCL_audio_spatial_embeddings
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 5
  early_stopping_delay_epochs: 25
  epochs: 100
  initial_epoch: null
  num_batches_train: null
  num_batches_val: null
log:
  study_name: Spatial-Embeddings
  keep_last_n_checkpoints: 5
  hyperparameters:
  - model
  - train.input_feature
  - embeddings
  - objectives
  - dataset.subset
  - dataset.train_config
  objectives_to_log:
  - polyphony_reg
  - polyphony_class
  - event_logits
  - framewise_polyphony_reg
  - framewise_polyphony_class
datetime: '20260615_201237'
path:
  study_subfolder: Wav2Vec2-Base-BirdSet-XCL/
  train_output: train_output/Spatial-Embeddings/Wav2Vec2-Base-BirdSet-XCL/
  eval_output: eval_output/Spatial-Embeddings/Wav2Vec2-Base-BirdSet-XCL/
python:
  base: venv/bin/python
  perch: perch-venv/bin/python
  train: train-venv/bin/python
  complete: /opt/complete-venv/bin/python
