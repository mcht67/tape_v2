general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/Polyphonic-BirdSet-train
  subset: HSN/HSN_polyphonic_8
  max_polyphony: 8
  train_config: HSN_polyphonic_8
  soundscape_config: HSN/HSN_polyphonic_8_soundscape_test
embeddings:
  name: AST-Birdset-XCL
  type: birdset
  dimension_type: spatial
  model_cfg:
    _target_: torch_models.BirdSetAST
    pretrained_model_path: DBD-research-group/AST-Birdset-XCL
model:
  _target_: model.TemporalCNN
objectives:
  polyphony_reg:
    loss:
      _target_: tensorflow.keras.losses.MeanSquaredError
    weight: 1.0
    confusion_matrix:
      type: regression_round
      threshold: 0.5
    label: polyphony_reg
  polyphony_class:
    loss:
      _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
      from_logits: true
    weight: 1.0
    confusion_matrix:
      type: classification
    label: polyphony_class
    num_classes: null
train:
  input_feature: audio
  input_feature_name: AST-Birdset-XCL_audio_spatial_embeddings
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 5
  early_stopping_delay_epochs: 25
  epochs: 100
  initial_epoch: null
  num_batches_train: null
  num_batches_val: null
log:
  study_name: Spatial-Embeddings
  keep_last_n_checkpoints: 5
  hyperparameters:
  - model
  - train.input_feature
  - embeddings
  - objectives
  - dataset.subset
  - dataset.train_config
  metrics: null
datetime: '20260612_012911'
path:
  study_subfolder: AST-Birdset-XCL/
  train_output: train_output/Spatial-Embeddings/AST-Birdset-XCL/
  eval_output: eval_output/Spatial-Embeddings/AST-Birdset-XCL/
python:
  base: venv/bin/python
  perch: perch-venv/bin/python
  train: train-venv/bin/python
  complete: /opt/complete-venv/bin/python
