general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/Polyphonic-BirdSet-train
  subset: PER/PER_polyphonic_8
  max_polyphony: 8
  train_config: PER_polyphonic_8
  soundscape_config: PER/PER_polyphonic_8_soundscape_test
embeddings:
  name: Wav2Vec2-Base-BirdSet-XCL
  type: birdset
  dimension_type: pooled
  model_cfg:
    _target_: torch_models.BirdSetWav2Vec2
    pooling: mean
    pretrained_model_path: DBD-research-group/Wav2Vec2-Base-BirdSet-XCL
model:
  _target_: model.SimpleMLP
  hidden_units:
  - 512
  - 256
  dropout_rate: 0.3
objectives:
  polyphony_degree_class:
    loss:
      _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
      from_logits: true
    weight: 1.0
    confusion_matrix:
      type: classification
    label: polyphony_degree
    num_classes: 7
train:
  input_feature: audio
  input_feature_name: Wav2Vec2-Base-BirdSet-XCL_audio_pooled_embeddings
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 10
  epochs: 100
  initial_epoch: null
  num_batches_train: null
  num_batches_val: null
log:
  study_name: Pooled-Embeddings
  exp_name: test-exp
  keep_last_n_checkpoints: 5
  hyperparameters:
  - model
  - train.input_feature
  - embeddings
  - objectives
  - dataset.subset
  - dataset.train_config
  metrics:
  - val_loss
  - val_accuracy
datetime: '20260609_145348'
path:
  study_subfolder: Wav2Vec2-Base-BirdSet-XCL/
  train_output: train_output/Pooled-Embeddings/Wav2Vec2-Base-BirdSet-XCL/
  eval_output: eval_output/Pooled-Embeddings/Wav2Vec2-Base-BirdSet-XCL/
python:
  base: venv/bin/python
  perch: perch-venv/bin/python
  train: train-venv/bin/python
  complete: /opt/complete-venv/bin/python
