general:
  random_seed: 42
dataset:
  huggingface_path: mcht67/Polyphonic-BirdSet-train
  subset: HSN
  train_config: HSN_polyphonic_8
  soundscape_config: HSN_soundscape_test
  max_polyphony: 8
embeddings:
  name: Birdnet_V2.3
  type: perch_v1
  dimension_type: pooled
model:
  # _target_: model.SimpleMLP # defines the model to be instantiated
  # hidden_units: [512, 256]
  # dropout_rate: 0.3
  _target_: model.TemporalCNN

objectives:

  polyphony_reg:
    loss:
      _target_: tensorflow.keras.losses.MeanSquaredError
    weight: 1.0
    confusion_matrix:
      type: regression_round
      threshold: 0.5
    label: polyphony_reg

  polyphony_class:
    loss:
      _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
      from_logits: true
    weight: 1.0
    confusion_matrix:
      type: classification
    label: polyphony_class
    num_classes:

  event_logits:
    loss:
      _target_: tensorflow.keras.losses.BinaryCrossentropy
      from_logits: false
      label_smoothing: 0.1
    scheduler:
      switch_epochs: [0, 10, 20, 30, 40]
      weights: [10.0, 5.0, 1.0, 0.5, 0.1]
    confusion_matrix:
      type: binary
    label: event_logits

  framewise_polyphony_reg:
    loss:
      _target_: tensorflow.keras.losses.MeanSquaredError
    scheduler:
      switch_epochs: [0, 10, 20, 30, 40]
      weights: [5.0, 10.0, 5.0, 1.0, 0.5]
    confusion_matrix:
      type: regression_round
      threshold: 0.5
    label: framewise_polyphony_reg

  framewise_polyphony_class:
    loss:
      _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
      from_logits: true
    scheduler:
      switch_epochs: [0, 10, 20, 30, 40]
      weights: [5.0, 10.0, 5.0, 1.0, 0.5]
    confusion_matrix:
      type: classification
    label: framewise_polyphony_class
    num_classes: 

  species_polyphony_reg:
    loss:
      _target_: tensorflow.keras.losses.MeanSquaredError
    weight: 1.0
    label: species_polyphony_reg

  species_polyphony_class:
    loss:
      _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
      from_logits: true 
    weight: 1.0
    label: species_polyphony_class
    num_classes: 

train:
  input_feature: null
  input_feature_name: EfficientNet-B1-BirdSet-XCL_audio_spatial_embeddings
  batch_size: 128
  learning_rate: 0.001
  epochs: 1
  initial_epoch: null
  num_batches_train: 1
  num_batches_val: 1
log:
  study_name: test-study
  hyperparameters: null
evaluation:
  example_indices:
  - 0
  - 1
  - 2
  num_examples: 3
datetime: '20260511_140603'
path:
  train_output: train_output/
  eval_output: eval_output/
  study_subfolder: study_subfolder/
  train_log_dir: train_output/test-study/local-test-experiment/logs/
  eval_log_dir: eval_output/test-study/local-test-experiment/logs/
  checkpoint_dir: train_output/test-study/local-test-experiment/checkpoints/
python:
  base: venv/bin/python
  perch: perch-venv/bin/python
  train: train-venv/bin/python
  complete: complete-venv/bin/python
