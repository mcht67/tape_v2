# This file defines the dvc stages and its depencies

stages:
  load_dataset:
    cmd:
      python source/load_dataset.py
    deps:
      - source/load_data.py
    params:
      - dataset.name
      - dataset.sampling_rate
    outs:
      - path.dataset_metadata

  embed_with_perch_v1:
    cmd: python source/embed_with_perch.py --model_keys ${embeddings.perch_v1_models} --compute_embeddings ${embeddings.compute_embeddings}
    deps:
      - source/embed_with_perch.py

  embed_with_perch_v2:
    cmd: python source/embed_with_perch.py --model_keys ${embeddings.perch_v2_models} --compute_embeddings ${embeddings.compute_embeddings}
    deps:
      - source/embed_with_perch.py

  embed_with_birdset:
    cmd: python source/embed_with_birdset.py --model_keys ${embeddings.birdset_models} --compute_embeddings ${embeddings.compute_embeddings}
    deps:
      - source/embed_with_birdset.py

  train:
    cmd: python source/train.py
    deps:
      - source/train.py
      - ${path.dataset}
    params:
      - general.random_seed
      - train
      - model
      

