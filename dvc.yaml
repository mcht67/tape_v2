  train:
    cmd: envs/train-venv/bin/python source/train.py
    deps:
      - source/train.py
      - ${path.dataset}
    params:
      - general.random_seed
      - model
      - objectives
      - train
      - log
    outs:
    - logs:
        cache: false # TODO: remove cache: false and persist: true once logs are pushed to and synced with remote
        persist: true
    - checkpoints:
        cache: false
        persist: true
      

