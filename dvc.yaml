# This file defines the dvc stages and its depencies

stages:

  # train:
  #   cmd: ${python.complete} source/train.py 
  #   deps:
  #     - source/train.py
  #     - source/utils/logs.py
  #     - source/utils/general.py
  #     - source/utils/config.py
  #     - source/utils/dataset.py
  #     - source/utils/losses.py
  #   params:
