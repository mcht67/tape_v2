# ==============================================

datetime: ${now:%Y%m%d_%H%M%S}

# CHANGING THESE COULD BREAK DVC TRACKING OR SYNCING TO ARCHIVE, BE CAREFUL!
path:
  study_subfolder:
  train_output: train_output/${log.study_name}/${path.study_subfolder} # exp_workflow.sh copies everything in train_output/ to the archive
  eval_output: eval_output/${log.study_name}/${path.study_subfolder} # exp_workflow.sh copies everything in eval_output/ to the archive
  soundscape_eval_output: soundscape_eval_output/${log.study_name}/${path.study_subfolder} # exp_workflow.sh copies everything in soundscape_eval_output/ to the archive
# ==============================================

# ==============================================  
python:
  base: venv/bin/python # Default for local runs without docker, overridden by exp_workflow.sh
  perch: perch-venv/bin/python # Default for local runs without docker, overridden by exp_workflow.sh
  train: train-venv/bin/python # Default for local runs without docker, overridden by exp_workflow.sh
  complete: complete-venv/bin/python # Default for local runs without docker, overridden by exp_workflow.sh
# ============================================== 

hydra:
  run:
    dir: .
  job:
    # Deactivates the change of the working directory
    chdir: false
  # Deactivates the hydra logging
  output_subdir: null
  job_logging:
    disable_existing_loggers: false

defaults:
  # It is possible to combine multiple configurations for the same model by using a list e.g. ["v1", "causal"]
  - general: default
  - dataset: default #empty # should be defined in multi_submission
  #- labels: all
  - embeddings: birdnet_V2.3.yaml # # should be defined in multi_submission
  #- preprocess: default
  - model: default #empty
  - head: default
  - objectives: default #empty # should be defined in multi_submission
  - train: 'default'
  - log: 'default'
  # - evaluation: 'default'
  - _self_

  