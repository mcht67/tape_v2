polyphony_reg:
  loss:
    _target_: tensorflow.keras.losses.MeanSquaredError
  weight: 1.0
  confusion_matrix:
    type: regression_round
    threshold: 0.5
  label: polyphony_reg

framewise_polyphony_reg:
  loss:
    _target_: tensorflow.keras.losses.MeanSquaredError
  scheduler:
    switch_epochs: [0, 5, 10, 15, 20, 25, 30]
    weights: [5.0, 10.0, 5.0, 1.0, 0.5, 0.1, 0.0]
  confusion_matrix:
    type: regression_round
    threshold: 0.5
  label: framewise_polyphony_reg

