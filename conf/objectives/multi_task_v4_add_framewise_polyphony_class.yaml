polyphony_class:
  loss:
    _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
    from_logits: true
  weight: 1.0
  confusion_matrix:
    type: classification
  label: polyphony_class
  num_classes: 

event_logits:
  loss:
    _target_: tensorflow.keras.losses.BinaryCrossentropy
    from_logits: false
    label_smoothing: 0.1
  scheduler:
    switch_epochs: [0, 5, 10, 15, 20]
    weights: [10.0, 5.0, 1.0, 0.5, 0.1]
  confusion_matrix:
    type: binary
  label: event_logits

framewise_polyphony_class:
  loss:
    _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
    from_logits: true
  scheduler:
    switch_epochs: [0, 5, 10, 15, 20]
    weights: [5.0, 10.0, 5.0, 1.0, 0.5]
  confusion_matrix:
    type: classification
  label: framewise_polyphony_class
  num_classes: 
