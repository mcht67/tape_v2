# polyphony_degree:
#   loss:
#     _target_: tensorflow.keras.losses.MeanSquaredError
#   weight: 1.0
#   confusion_matrix:
#     type: regression_round
#     threshold: 0.5
#   label: polyphony_degree

polyphony_degree_class:
  loss:
    _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
    from_logits: true
  weight: 1.0
  confusion_matrix:
    type: classification
  label: polyphony_degree
  num_classes: 9

event_logits:
  loss:
    _target_: tensorflow.keras.losses.BinaryCrossentropy
    from_logits: false
    label_smoothing: 0.1
  scheduler:
    switch_epochs: [0, 10, 20, 30, 40]
    weights: [10.0, 5.0, 1.0, 0.5, 0.1]
  confusion_matrix:
    type: binary
  label: event_logits

