framewise_polyphony_class:
  loss:
    _target_: tensorflow.keras.losses.SparseCategoricalCrossentropy
    from_logits: true
  scheduler:
    switch_epochs: [0, 10, 20, 30, 40]
    weights: [5.0, 10.0, 5.0, 1.0, 0.5]
  confusion_matrix:
    type: classification
  label: framewise_polyphony
  num_classes: 9